server {
    listen 80;
    server_name 5.223.60.68 mymorning.in www.mymorning.in localhost;
    # Redirect all port 80 traffic to HTTPS 
    # except certbot challenge if needed natively (we use standalone so doing 301 is fine if cert is already issued)
    return 301 https://mymorning.in$request_uri;
}

server {
    listen 443 ssl;
    server_name mymorning.in www.mymorning.in;

    ssl_certificate /etc/letsencrypt/live/mymorning.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mymorning.in/privkey.pem;
    
    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend container running on port 8080
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
