server {
    listen 80;
    server_name 5.223.60.68 mymorning.in www.mymorning.in localhost;
    # Redirect all port 80 traffic to HTTPS 
    # except certbot challenge if needed natively (we use standalone so doing 301 is fine if cert is already issued)
    return 301 https://mymorning.in$request_uri;
}

server {
    listen 443 ssl;
    server_name mymorning.in www.mymorning.in;
    client_max_body_size 10M;

    ssl_certificate /etc/letsencrypt/live/mymorning.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mymorning.in/privkey.pem;
    
    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend container running on port 8080
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;

        # Resilience: Auto-retry backends on errors/502s
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;

        # Large Buffers: Support large JWT headers
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
        client_max_body_size 10M;
    }

    # Legacy path without trailing slash — redirect to ensure proper routing
    location = /api {
        return 301 /api/;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
