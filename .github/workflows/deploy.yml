name: CI/CD Deploy

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

  backend-checks:
    name: Backend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Test backend
        working-directory: backend
        run: mvn -B test

  deploy-production:
    name: Deploy production
    runs-on: ubuntu-latest
    needs:
      - frontend-checks
      - backend-checks
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    env:
      HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
      HETZNER_USERNAME: ${{ secrets.HETZNER_USERNAME }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      PROJECT_PATH: ${{ secrets.PROJECT_PATH }}

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/hetzner_deploy_key
          chmod 600 ~/.ssh/hetzner_deploy_key

          HOST="$(printf '%s' "$HETZNER_HOST" | tr -d '\r\n[:space:]')"
          HOST="${HOST#ssh://}"
          HOST="${HOST#http://}"
          HOST="${HOST#https://}"
          HOST_WITHOUT_USER="${HOST#*@}"
          SSH_HOST="$HOST_WITHOUT_USER"
          SSH_PORT="22"

          if [[ "$HOST_WITHOUT_USER" =~ ^(.+):([0-9]+)$ ]]; then
            SSH_HOST="${BASH_REMATCH[1]}"
            SSH_PORT="${BASH_REMATCH[2]}"
          fi

          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy on Hetzner
        run: |
          USERNAME="$(printf '%s' "$HETZNER_USERNAME" | tr -d '\r\n[:space:]')"
          HOST="$(printf '%s' "$HETZNER_HOST" | tr -d '\r\n[:space:]')"
          HOST="${HOST#ssh://}"
          HOST="${HOST#http://}"
          HOST="${HOST#https://}"

          if [[ "$HOST" == *@* ]]; then
            SSH_USER="${HOST%@*}"
            HOST_WITHOUT_USER="${HOST#*@}"
          else
            SSH_USER="$USERNAME"
            HOST_WITHOUT_USER="$HOST"
          fi

          SSH_HOST="$HOST_WITHOUT_USER"
          SSH_PORT="22"
          if [[ "$HOST_WITHOUT_USER" =~ ^(.+):([0-9]+)$ ]]; then
            SSH_HOST="${BASH_REMATCH[1]}"
            SSH_PORT="${BASH_REMATCH[2]}"
          fi

          echo "Deploying to $SSH_USER@$SSH_HOST:$SSH_PORT"
          ssh -p "$SSH_PORT" -i ~/.ssh/hetzner_deploy_key \
            "$SSH_USER@$SSH_HOST" \
            "PROJECT_PATH='$PROJECT_PATH' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          cd "$PROJECT_PATH"

          BACKUP_DIR="$(mktemp -d)"
          for ENV_FILE in .env .env.production; do
            if [ -f "$ENV_FILE" ]; then
              cp "$ENV_FILE" "$BACKUP_DIR/$ENV_FILE"
            fi
          done

          STASH_COUNT_BEFORE="$(git stash list | wc -l)"
          git stash push --include-untracked --message "ci-env-backup" -- .env .env.production || true
          STASH_COUNT_AFTER="$(git stash list | wc -l)"
          git pull --ff-only origin master

          for ENV_FILE in .env .env.production; do
            if [ -f "$BACKUP_DIR/$ENV_FILE" ]; then
              cp "$BACKUP_DIR/$ENV_FILE" "$ENV_FILE"
            fi
          done

          if [ -f .env.production ]; then
            docker compose --env-file .env.production up -d --build
          else
            docker compose up -d --build
          fi

          if [ "$STASH_COUNT_AFTER" -gt "$STASH_COUNT_BEFORE" ]; then
            git stash drop stash@{0} || true
          fi

          docker image prune -f
          rm -rf "$BACKUP_DIR"
          REMOTE_SCRIPT
