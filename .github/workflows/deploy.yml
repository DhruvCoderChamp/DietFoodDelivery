name: CI/CD Deploy

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

  backend-checks:
    name: Backend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Test backend
        working-directory: backend
        run: mvn -B test

  deploy-production:
    name: Deploy production
    runs-on: ubuntu-latest
    needs:
      - frontend-checks
      - backend-checks
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner_deploy_key
          chmod 600 ~/.ssh/hetzner_deploy_key
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on Hetzner
        run: |
          ssh -i ~/.ssh/hetzner_deploy_key \
            "${{ secrets.HETZNER_USERNAME }}@${{ secrets.HETZNER_HOST }}" \
            "set -e
             cd '${{ secrets.PROJECT_PATH }}'
             git pull --ff-only origin master
             docker compose up -d --build
             docker image prune -f"
