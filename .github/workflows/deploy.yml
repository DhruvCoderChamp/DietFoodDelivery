name: CI/CD Deploy

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

  backend-checks:
    name: Backend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Test backend
        working-directory: backend
        run: mvn -B test

  deploy-production:
    name: Deploy production
    runs-on: ubuntu-latest
    needs:
      - frontend-checks
      - backend-checks
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    env:
      HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
      HETZNER_USERNAME: ${{ secrets.HETZNER_USERNAME }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      PROJECT_PATH: ${{ secrets.PROJECT_PATH }}

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/hetzner_deploy_key
          chmod 600 ~/.ssh/hetzner_deploy_key

          HOST="$(printf '%s' "$HETZNER_HOST" | tr -d '\r\n[:space:]')"
          HOST="${HOST#ssh://}"
          HOST="${HOST#http://}"
          HOST="${HOST#https://}"
          HOST_WITHOUT_USER="${HOST#*@}"
          SSH_HOST="$HOST_WITHOUT_USER"
          SSH_PORT="22"

          if [[ "$HOST_WITHOUT_USER" =~ ^(.+):([0-9]+)$ ]]; then
            SSH_HOST="${BASH_REMATCH[1]}"
            SSH_PORT="${BASH_REMATCH[2]}"
          fi

          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy on Hetzner
        run: |
          USERNAME="$(printf '%s' "$HETZNER_USERNAME" | tr -d '\r\n[:space:]')"
          HOST="$(printf '%s' "$HETZNER_HOST" | tr -d '\r\n[:space:]')"
          HOST="${HOST#ssh://}"
          HOST="${HOST#http://}"
          HOST="${HOST#https://}"

          if [[ "$HOST" == *@* ]]; then
            SSH_USER="${HOST%@*}"
            HOST_WITHOUT_USER="${HOST#*@}"
          else
            SSH_USER="$USERNAME"
            HOST_WITHOUT_USER="$HOST"
          fi

          SSH_HOST="$HOST_WITHOUT_USER"
          SSH_PORT="22"
          if [[ "$HOST_WITHOUT_USER" =~ ^(.+):([0-9]+)$ ]]; then
            SSH_HOST="${BASH_REMATCH[1]}"
            SSH_PORT="${BASH_REMATCH[2]}"
          fi

          echo "Deploying to $SSH_USER@$SSH_HOST:$SSH_PORT"
          ssh -p "$SSH_PORT" -i ~/.ssh/hetzner_deploy_key \
            "$SSH_USER@$SSH_HOST" \
            "set -e
             cd '$PROJECT_PATH'
             git pull --ff-only origin master
             docker compose up -d --build
             docker image prune -f"
