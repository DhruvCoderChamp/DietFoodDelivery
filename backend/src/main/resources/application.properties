spring.datasource.url=jdbc:postgresql://db:5432/mymorning
spring.datasource.username=postgres
spring.datasource.password=root

# HikariCP Connection Pool - Reliability tuning for Docker environment
# Keep trying to connect even if DB is momentarily slow/unavailable
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=600000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
server.forward-headers-strategy=native

# Fix for 413 Request Entity Too Large (Spring Boot level)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
