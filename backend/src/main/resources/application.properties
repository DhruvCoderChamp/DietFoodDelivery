spring.datasource.url=${DB_URL:jdbc:postgresql://db:5432/mymorning}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

# HikariCP Connection Pool - Reliability tuning for Docker environment
# Keep trying to connect even if DB is momentarily slow/unavailable
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.leak-detection-threshold=2000

# Hibernate 6 Fix: Disable JDBC metadata defaults extraction during startup.
# This prevents the NullPointerException when DB is slow to respond.
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Explicitly set dialect to avoid Hibernate trying to detect it from metadata
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
server.forward-headers-strategy=native

# Fix for 413 Request Entity Too Large (Spring Boot level)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
