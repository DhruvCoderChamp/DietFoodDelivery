# ===============================
# DATABASE CONFIG (Docker-friendly)
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://db:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

# ===============================
# HIKARI CONNECTION POOL
# ===============================

# Fail fast but allow small retry window (better than 0)
spring.datasource.hikari.initialization-fail-timeout=30000

# Pool sizing
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# Timeouts
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# Leak detection (safe threshold)
spring.datasource.hikari.leak-detection-threshold=15000
# Keepalive: ensures connections don't go stale in the background
spring.datasource.hikari.keepalive-time=30000
# Validation: test connections before handing them to the app
spring.datasource.hikari.connection-test-query=SELECT 1

# ===============================
# HIBERNATE / JPA CONFIG
# ===============================

# Performance: Disable logging SQL in production to prevent disk-fill and slowdowns
spring.jpa.show-sql=false

# Explicit dialect (correct)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ddl-auto set to update (Automatically reconcile schema)
spring.jpa.hibernate.ddl-auto=update

# Ensure session survives until serialization is complete
spring.jpa.open-in-view=true

# ===============================
# SERVER CONFIG & OPTIMIZATION
# ===============================
server.forward-headers-strategy=native

# GZIP COMPRESSION (SENIOR OPTIMIZATION)
# This reduces JSON size significantly, especially for base64-heavy responses
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.compression.min-response-size=1024

# Graceful Operations: Finish existing requests/orders before shutting down
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ===============================
# FILE UPLOAD LIMIT
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
