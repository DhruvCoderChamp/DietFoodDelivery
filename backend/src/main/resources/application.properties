# ===============================
# DATABASE CONFIG (Docker-friendly)
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://db:5432/mymorning}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

# ===============================
# HIKARI CONNECTION POOL
# ===============================

# Fail fast but allow small retry window (better than 0)
spring.datasource.hikari.initialization-fail-timeout=30000

# Pool sizing
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# Timeouts
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# Leak detection (safe threshold)
spring.datasource.hikari.leak-detection-threshold=10000

# ===============================
# HIBERNATE / JPA CONFIG
# ===============================

# Avoid DB metadata calls during startup (good for Docker)
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Explicit dialect (correct)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ddl-auto set to update (Automatically reconcile schema)
spring.jpa.hibernate.ddl-auto=update

# Logging
spring.jpa.show-sql=false

# ===============================
# SERVER CONFIG
# ===============================
server.forward-headers-strategy=native

# ===============================
# FILE UPLOAD LIMIT
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
