version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: mm_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: mymorning
    volumes:
      # Host-bind mount: data lives directly on the server disk at this path.
      # This survives BOTH 'docker-compose down' AND 'docker-compose down -v'.
      - /var/lib/mymorning/pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      backend-net:
        ipv4_address: 172.25.0.100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mymorning"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: mm_backend
    restart: always
    environment:
      - DB_URL=jdbc:postgresql://172.25.0.100:5432/mymorning
      - DB_USERNAME=postgres
      - DB_PASSWORD=root
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      backend-net:

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mm_frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      backend-net:

networks:
  backend-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
