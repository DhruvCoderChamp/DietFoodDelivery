version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: mm_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      # RECOVERING YOUR 17 ITEMS: Targeting the most likely original volume name
      - deliveryfoodapp_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  db-backup:
    image: postgres:15-alpine
    container_name: mm_db_backup
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGPASSWORD: postgres
      PGHOST: db
    volumes:
      - ./backups:/backups
    entrypoint: |
      sh -c 'while true; do 
        echo "Starting daily backup...";
        mkdir -p /backups;
        pg_dump -h db -U postgres postgres > /backups/manual_backup_$$(date +%Y%m%d_%H%M%S).sql;
        echo "Backup complete. Cleaning old backups...";
        find /backups -name "manual_backup_*.sql" -mtime +7 -delete;
        sleep 86400; 
      done'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-net

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: mm_backend
    restart: always
    environment:
      # Standard Spring Boot environment variables (Guaranteed override)
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      # Custom vars for backward compatibility in codebase
      DB_URL: jdbc:postgresql://db:5432/postgres
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mm_frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - backend-net

networks:
  backend-net:
    driver: bridge

volumes:
  deliveryfoodapp_postgres_data:
    external: true
    name: dietfooddelivery_postgres_data
