version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mm_backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://ep-lucky-king-a12dzwvd.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
      SPRING_DATASOURCE_USERNAME: neondb_owner
      SPRING_DATASOURCE_PASSWORD: npg_Rj0VLTf3SznF
      DB_URL: jdbc:postgresql://ep-lucky-king-a12dzwvd.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
      DB_USERNAME: neondb_owner
      DB_PASSWORD: npg_Rj0VLTf3SznF
    ports:
      - "8080:8080"
    networks:
      - backend-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mm_frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - backend-net

networks:
  backend-net:
    driver: bridge
